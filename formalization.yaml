version: "v0.4"

project:
  name: "SIC-POVMs exist in every dimension (Open Quantum Problem 23): a Lean 4 formalization"
  description: >-
    A Lean 4 proof that symmetric informationally complete POVMs (SIC-POVMs) exist in every
    finite dimension. The compared statement is OpenQuantumProblem23.sicPOVMs from
    google-deepmind/formal-conjectures, the existence form of Open Quantum Problem 23 and of
    Zauner's conjecture: for every d >= 1 there are d^2 unit vectors in C^d whose pairwise
    squared overlaps all equal 1/(d+1). The configuration also compares the eleven benchmark
    theorems of the same file, which state the cases d = 56, 58, 59, 60, 64, 68, 69, 70, 71, 72
    and 75. The mathematics is due to Radchenko and Wheeler, who build the required vectors from
    special values of the modular quantum dilogarithm and show by class field theory that a
    suitable Galois automorphism exists, together with the reduction of Appleby, Flammia and
    Kopp from such "ghost" vectors to SIC-POVMs. The Lean proof follows the argument of these
    sources in five parts: the reduction to a ghost fiducial with a unimodular Galois flip,
    the finite identities for the special values, their algebraicity by a 2-adic argument, the
    analytic properties of Faddeev's quantum dilogarithm, and the reciprocity argument through
    ray class fields, Artin reciprocity and the Chebotarev density theorem. Class field theory
    comes from the external Lean library of N. Yamaguchi and the Chebotarev density theorem
    from a vendored, ported copy of the library of C. Birkbeck. The repository also proves, as
    a further result outside the compared configuration, the existence of rank-r SICs of
    Appleby, Flammia and Kopp for r >= 1, d > 2r + 1 and r(d - r) dividing d^2 - 1. All proofs
    depend only on propext, Classical.choice and Quot.sound, and no sorry remains outside the
    deliberate placeholders of the Challenge. An earlier, independent Lean formalization of SIC
    existence by Māris Ozols exists, with its own statements.
  authors: ["Yaoling Yang"]
  responsible_maintainers: ["Yaoling Yang"]
  license: "Apache-2.0"

