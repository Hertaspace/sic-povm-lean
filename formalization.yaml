related_formalizations:
  - id: "https://github.com/marozols/SIC-existence"
    relationship: "independent"
    note: "An earlier Lean 4 formalization of the existence of SIC-POVMs by Māris Ozols, made public on 9 October 2026, with its own statements. We learned of it after completing and releasing this formalization. We did not use its code and did not compare the two developments line by line."
  - id: "https://github.com/n-yamaguchi-0729/ClassFieldTheory"
    relationship: "builds-on"
    note: "Nyll, by Naganori Yamaguchi, Apache-2.0. Supplies ray class fields and Artin reciprocity. Used by the Solution only, pinned in lake-manifest.json at commit fc644f42dade5bdc7157fc3ef2eef4dbf2d6a565, and not in the import closure of the Challenge. Two short theorems of Nyll are restated unchanged in SICLean/NyllBridge/RayClassSubgroup.lean, because their upstream files are not yet Lean modules at that commit. A fork at the commit used by release v1.0 is kept at Hertaspace/ClassFieldTheory."
  - id: "https://github.com/CBirkbeck/chebotarev-density"
    relationship: "adapts"
    note: "Chebotarev density theorem, development branch at commit 8575c9df1ae0a61120ab5c964c7911414254bec7, Apache-2.0, by Chris Birkbeck with commits by Riccardo Brasca. Vendored under CebotarevDensity/ and ported to the Lean and Mathlib versions of this repository. Eight files were changed for release v1.0, as listed in CebotarevDensity/PROVENANCE.md and PORTING.diff, and seven files received small further adaptations for release v1.1 (Lean v4.36.0), also listed in PROVENANCE.md. Used by the Solution only."
  - id: "https://github.com/google-deepmind/formal-conjectures"
    relationship: "builds-on"
    note: "The definitions and statements of Open Quantum Problem 23 are those of formal-conjectures (Apache-2.0), kept verbatim in Challenge.lean and SICLean/Statement.lean."

