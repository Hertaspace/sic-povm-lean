status:
  scope: >-
    The twelve theorems of Open Quantum Problem 23 in formal-conjectures are proved in full: the
    existence of SIC-POVMs in every dimension d >= 1 and the eleven benchmark dimensions. The
    statement is the standard description of a SIC-POVM as a family of d^2 unit vectors with
    constant squared overlap 1/(d+1). The proof takes no hypotheses and assumes no result of the
    literature without proving it in Lean. Results of the sources are proved here or taken from
    the pinned Lean libraries named under related_formalizations.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
