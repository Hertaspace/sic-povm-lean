automation:
  methods:
    - method: "agent"
      framework: "LLM coding agents working in a Lean 4 project"
      tool_setup: >-
        Large language model agents wrote the Lean files, in parallel and in isolated working
        copies, with Lean's compiler as the immediate check. A human coordinator split the work,
        chose the sources and accepted or rejected each merge. Models are not named here by the
        authors' choice. Many files were produced in several rounds of repair after compiler errors.
    - method: "agent"
      tool_setup: >-
        Independent review by LLM agents from different providers, who read the statements, the
        definitions and the proofs of the main chain and tried to find errors and gaps. This
        complements the kernel checks and does not replace them.
    - method: "manual"
      tool_setup: >-
        Human direction: choice of the problem and sources, decomposition of the proof into parts,
        reading of the statements in Challenge.lean against formal-conjectures, running the build
        and the verification commands, and final acceptance.
  notes: >-
    The Lean code was written largely by LLM agents under human direction, with cross-checking
    between agents. The trust base does not depend on how the code was produced. A reader needs
    only the statements in Challenge.lean, Mathlib's definitions of the notions they use, the Lean
    kernel (or one of the independent checkers) and the three standard axioms. Costs, hardware and
    prompt logs are not reconstructed here.

fidelity:
  divergences: >-
    Challenge.lean keeps the module header and the public section wrapper of the original file.
    It omits the attributes (which come from FormalConjecturesUtil) and the other declarations
    of the original file (witness families for small dimensions and the like), and uses
    public import Mathlib in place of its imports. The
    definitions and the twelve theorems are verbatim. SICLean/Statement.lean introduces the name
    ZaunerExistence for the statement of sicPOVMs, and sicPOVMs follows from it directly. The
    formal proof is not a line-by-line transcription of the sources. Many steps are written out in
    more detail than in the papers, results used by the papers are proved or imported from Lean
    libraries, and some arguments are arranged differently to suit Lean. SICLean/NyllBridge/RayClassSubgroup.lean
    restates two theorems of the Nyll library unchanged, for the reason given under
    related_formalizations. The statement for d = 1 is trivial. Both Radchenko-Wheeler works are
    preprints (one on arXiv, the other on the author's web page, with no archival identifier), and
    we do not know of either having been refereed. The Lean proof of their results is checked by
    the kernel and does not rest on that.

review:
  status: "agent-reviewed"
  reviewers:
    - "Independent LLM review agents (several providers, not named)"
    - "Lean kernel and the independent checkers lean4lean, nanoda, con-leche and con-ron, through lake comparator --paranoid"
  notes: >-
    VERIFICATION.md records the commands and outputs. For release v1.1 (Lean v4.36.0, Mathlib
    fc4f59e577fe, Nyll fc644f42dade, every file a Lean module), run on 24 and 25 November 2026
    on Linux 5.15.0 x86_64 (Ubuntu 20.04.6 LTS, LXD container): lake build succeeded (21435
    jobs), the axioms of zaunerExistence, hasRSIC, sicPOVMs and the eleven hasSICPOVM theorems
    are the three standard ones, lake build Challenge succeeded with only the expected sorry
    warning, verification/check_challenge.py confirmed that the 21 declarations of Challenge.lean
    are those of the formal-conjectures file, a scan of 9808 constants of 460 modules found no
    direct sorryAx and no nonstandard axiom, and lake comparator --paranoid accepted the solution
    in all six kernels (1 h 43 min, 6.6 GB peak). The full-environment lake check --paranoid and
    the nanoda run on the project export were not repeated for v1.1. In the v1.0 record (Lean
    v4.35.0-rc2) lake check --paranoid was accepted by five kernels, and nanoda ran out of
    stack on the whole environment but accepted an export of all declarations of this project.
    No human mathematician has refereed the Lean development. The author has not independently
    re-derived the mathematics of the sources.

alignment:
  namespace: "OpenQuantumProblem23"
  statements:
    - source: "Open Quantum Problem 23, existence formulation"
      lean: "OpenQuantumProblem23.sicPOVMs"
      module: "SICLean.Solution"
      status: "proved"
      note: "Same statement in Challenge.lean, copied from formal-conjectures."
    - source: "Benchmark cases d = 56, 58, 59, 60, 64, 68, 69, 70, 71, 72, 75 of the same file"
      lean: "OpenQuantumProblem23.hasSICPOVM_56 and ten others"
      module: "SICLean.Solution"
      status: "proved"
      note: "One-line consequences of sicPOVMs."
    - source: "AFK25 Theorem 1.46, with RW26 and RW-rec"
      lean: "SICLean.FinalAssembly.zaunerExistence"
      module: "SICLean.FinalAssembly"
      status: "proved"
      note: "The statement ZaunerExistence of sicPOVMs, assembled from the five parts described in the README."

acknowledgements: >-
  The mathematics is due to D. Radchenko and C. Wheeler, building on the work of M. Appleby,
  S. T. Flammia and G. S. Kopp. The class field theory library Nyll is by Naganori
  Yamaguchi and the Chebotarev density development by Chris Birkbeck and Riccardo Brasca. The
  statements come from the formal-conjectures project. Māris Ozols made an earlier, independent
  formalization of the same existence result public.
