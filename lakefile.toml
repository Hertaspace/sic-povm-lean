name = "SICLean"
version = "0.1.0"
defaultTargets = ["SICLean"]

# Mathlib, pinned. The definitions of Open Quantum Problem 23 from
# google-deepmind/formal-conjectures compile unchanged with this version.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "065356127b1dc0016f66b7283ce0ce2c4055aa55"

[[lean_lib]]
name = "SICLean"

# Vendored Chebotarev density theorem (CBirkbeck/chebotarev-density, development branch, Apache-2.0); see CebotarevDensity/PROVENANCE.md.
[[lean_lib]]
name = "CebotarevDensity"

# External class field theory library (n-yamaguchi-0729/ClassFieldTheory, "Nyll", Apache-2.0), pinned.
[[require]]
name = "Nyll"
git = "https://github.com/n-yamaguchi-0729/ClassFieldTheory.git"
rev = "fbd320cd8b1b06487c58227e92eb135794267709"

# The statements of Open Quantum Problem 23 with `sorry`, used only by `lake comparator`
# (see comparator.json). Not a default target.
[[lean_lib]]
name = "Challenge"
